[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
src = ["src", "scripts", "tests"]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "N", "PT", "RUF", "S"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = ["build_archive", "fake_proxy", "run_platform"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
ignore_missing_imports = true

# У bm25s нет аннотаций типов. Его вызовы собраны в LexicalRetriever: наружу
# оттуда выходят только свои типы.
[[tool.mypy.overrides]]
module = ["bm25s"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311", "S603"]
# Абзац статьи закона в выгрузке — одна строка; в тестах он записан так же.
"tests/test_law_*.py" = ["E501"]
"scripts/run_platform.py" = ["S603", "S607"]
"scripts/fake_proxy.py" = ["S104"]
"src/lex_retry.py" = ["S311"]
