# Поиск на настоящей базе по golden-набору (eval/cases.yaml): запрос — вопрос кейса
# целиком, выдача — все положения с ненулевой оценкой.
# any_source — кейсы, где в первых k положениях есть хотя бы один источник;
# all_sources — кейсы, где в первых k положениях есть все источники. Источник без
# пункта или части (документ, статья закона целиком) закрывает любое его положение.
# ranks: first — место первого найденного источника, all — место, к которому
# найдены все; null — в выдаче нет.
# Файл фиксирует состояние, а не цель: изменились цифры — смотрим, какие кейсы
# сдвинулись, и обновляем файл вместе с объяснением в PR.

