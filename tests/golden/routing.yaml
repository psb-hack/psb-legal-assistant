# Маршрут по сущностям на настоящей базе (кейсы eval/cases.yaml), поиск — BM25,
# запрос — search_query из диалога, today — день, от которого считается
# действующая редакция.
#
# plans — планы кейсов, где диалог что-то назвал: документ, охват (whole —
# целиком, relevant — найденные положения), причины. Остальным кейсам отвечает
# один общий поиск.
# demo_dialogues — причины маршрута у положения-источника каждого источника
# кейса; пустой список — источник пришёл из общего поиска (демо 18).
# missed_by_search — сколько источников кейса нет в контексте без маршрута; с
# маршрутом в контексте все.
# coverage — доля кейсов с источниками, у которых в контексте есть хотя бы один
# источник (any_source) и все источники (all_sources): search_only — 10 лучших
# положений общего поиска, with_route — маршрут и те же 10 положений без
# повторов. missing_any — кейсы без единого источника в контексте, missing_some —
# с частью источников. context — размер контекста по всем 39 кейсам: число
# положений и знаков (заголовок и текст).
# Файл фиксирует состояние, а не цель: изменились цифры — смотрим, какие кейсы
# сдвинулись, и обновляем файл вместе с объяснением в PR.

