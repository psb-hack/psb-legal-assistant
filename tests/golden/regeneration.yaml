# Генерация с проверкой (lex_regeneration.generate_verified) на вручную
# составленных ответах на демо-вопросы (tests/golden/answer_rendering.yaml)
# и на девяти их искажениях (tests/golden/verification.yaml). Модель подставная:
# цифры показывают поведение цикла, а не модели.
# paths — сколько ответов прошло каким путём (значения AnswerPath).

# Верный ответ с первого раза: текст совпадает с rendered, вызов один.
correct:
  accepted: 6

# Первый ответ искажён, второй верен. Семь искажений исправляет вторая попытка:
# текст совпадает с rendered. Два искажения повторяют карантинную вставку:
# второй вызов на них не тратится, утверждение удаляется; у демо 7 оно
# единственное, поэтому ответ — ссылка на положение без значения.
distorted_then_correct:
  paths:
    regenerated: 7
    cleaned: 1
    unconfirmed: 1
  # 7 × 2 + 2 × 1
  model_calls: 16

# Обе попытки искажены одинаково: искажённое утверждение в текст не попадает.
distorted_twice:
  paths:
    cleaned: 7
    unconfirmed: 2
  unconfirmed:
    другая единица срока: >-
      Положения по этому вопросу в базе знаний есть: ТК РФ, ст. 70, ч. 5.
      Подтвердить ответ по их тексту не удалось, поэтому я его не привожу.
    слова карантинной вставки: >-
      Положения по этому вопросу в базе знаний есть: Договор аренды нежилого
      помещения № А-08/2024, п. 4.3. Подтвердить ответ по их тексту не удалось,
      поэтому я его не привожу.
