# Выбор редакции по дате события на настоящей базе (PSB-18).
# День вопроса: от него отсчитываются относительные даты и «действующая» редакция.
today: 2026-11-12

# Семейство редакций в базе одно — регламент согласования договоров.
# clause и states: в выбранной редакции лежит положение с таким текстом.
company:
  # Демо-вопрос 5.
  - question: Договор на 12 млн рублей заключали в августе 2024 года. Нужно ли было одобрение генерального директора?
    edition: 2023-01-10
    date_stated: true
    clause: п. 2.4
    states: Договоры на сумму свыше 10 000 000 (десяти миллионов) рублей подлежат одобрению генеральным директором до подписания.
  # Парный кейс из задачи: тот же договор в мае 2025 года.
  - question: Договор на 12 млн рублей заключали в мае 2025 года. Нужно ли было одобрение генерального директора?
    edition: 2025-03-01
    date_stated: true
    clause: п. 2.4
    states: Договоры на сумму свыше 15 000 000 (пятнадцати миллионов) рублей подлежат одобрению генеральным директором до подписания.
  - question: Договор на 12 млн рублей заключили 28.02.2025. Нужно ли было одобрение генерального директора?
    edition: 2023-01-10
    date_stated: true
    clause: п. 2.4
    states: Договоры на сумму свыше 10 000 000 (десяти миллионов) рублей подлежат одобрению генеральным директором до подписания.
  - question: Договор на 12 млн рублей заключили 1 марта 2025 г. Нужно ли было одобрение генерального директора?
    edition: 2025-03-01
    date_stated: true
    clause: п. 2.4
    states: Договоры на сумму свыше 15 000 000 (пятнадцати миллионов) рублей подлежат одобрению генеральным директором до подписания.
  - question: Договор на 12 млн рублей заключали в прошлом году. Нужно ли было одобрение генерального директора?
    across: [2023-01-10, 2025-03-01]
    boundaries: [2025-03-01]
  - question: Договор на 12 млн рублей заключали в 2022 году. Нужно ли было одобрение генерального директора?
    missing: before_first_edition
  - question: Нужно ли одобрение генерального директора для договора на 12 млн рублей?
    edition: 2025-03-01
    date_stated: false
    clause: п. 2.4
    states: Договоры на сумму свыше 15 000 000 (пятнадцати миллионов) рублей подлежат одобрению генеральным директором до подписания.

