# Извлечение величин на базе организаторов (21 документ).
# spelled_pairs — пары «цифры (прописью)»: сколько из них разобрано и сошлось
# с цифрами, давая одну величину. numeral_like_words — разные слова базы,
# начало которых совпадает с началом числительного: сколько из них читается
# как количественное или порядковое. unread — остальные: не числительные
# («одновременно»), порядковые женского рода («часть первая» — адрес в законе)
# и «полуторном».

spelled_pairs:
  agree: 27
  total: 27

numeral_like_words:
  read: 71
  total: 91
  unread:
    - вторая
    - второй
    - вторую
    - одиночном
    - одновременно
    - одновременном
    - однозначным
    - одностороннем
    - первая
    - первичной
    - первичными
    - первой
    - первую
    - первые
    - первый
    - полуторном
    - третьей
    - третьих
    - трехсторонней
    - шестой
