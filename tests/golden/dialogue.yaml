# Кейсы eval/cases.yaml, в которых больше одной реплики, на настоящей базе.
#
# dialogues: question — последняя реплика пользователя; named_by_user — что назвал
# пользователь (все реплики); suggested_by_assistant — что назвал только ассистент
# и пользователь не оспорил; query — строки запроса для поиска (вопрос повторён
# QUESTION_WEIGHT раз, слов ассистента нет).
#
# retrieval: место первого источника кейса (first) и место, к которому найдены
# все источники (all), в выдаче BM25. raw — запрос равен тексту кейса целиком,
# вместе с репликами ассистента; dialogue — запрос из search_query.
# Файл фиксирует состояние, а не цель. Хуже, чем по тексту целиком, ищутся
# demo-15 и team-06: там нужные слова («условия возврата помещения», «п. 3.1
# договора аренды») стоят в реплике ассистента, а она в запрос не идёт. В обоих
# кейсах договор назван в диалоге — целиком его даст маршрутизация (PSB-17).

dialogues:
  demo-06:
    question: А за сколько дней после поставки нужно проверить качество?
    named_by_user: [ООО «Альфа-Трейд»]
    suggested_by_assistant: ["Договор поставки № П-17/2024"]
    query:
      - Какой гарантийный срок на товар по договору с ООО «Альфа-Трейд»?
      - А за сколько дней после поставки нужно проверить качество?
      - А за сколько дней после поставки нужно проверить качество?
      - Договор поставки № П-17/2024
  demo-15:
    question: А-08/2024. Можно просто сдать ключи или обязательно оформлять акт?
    named_by_user: [ООО «Северный Склад», "Договор аренды нежилого помещения № А-08/2024"]
    suggested_by_assistant: []
    query:
      - Мы арендуем склад у «Северного Склада». Планируем съезжать.
      - А-08/2024. Можно просто сдать ключи или обязательно оформлять акт?
      - А-08/2024. Можно просто сдать ключи или обязательно оформлять акт?
  demo-16:
    question: П-17/2024. Доставка и упаковка уже включены в цену или их оплачиваем отдельно?
    named_by_user: [ООО «Альфа-Трейд», "Договор поставки № П-17/2024"]
    suggested_by_assistant: []
    query:
      - Мы заключили договор поставки мебели с «Альфа-Трейд». Хочу проверить расходы перед оплатой.
      - П-17/2024. Доставка и упаковка уже включены в цену или их оплачиваем отдельно?
      - П-17/2024. Доставка и упаковка уже включены в цену или их оплачиваем отдельно?
  # «С Альфой» из первой реплики снято ответом пользователя; ассистент перечислил
  # обоих контрагентов, поэтому от него ничего не взято.
  demo-17:
    question: «Альфа-Трейдинг», у них компьютеры покупали. На сколько гарантия?
    named_by_user: [ООО «Альфа-Трейдинг»]
    suggested_by_assistant: []
    query:
      - Подскажите гарантию по договору с «Альфой».
      - «Альфа-Трейдинг», у них компьютеры покупали. На сколько гарантия?
      - «Альфа-Трейдинг», у них компьютеры покупали. На сколько гарантия?
  demo-18:
    question: Да. В юротдел нужно отнести сразу или есть какой-то срок?
    named_by_user: []
    suggested_by_assistant: [ООО «Меридиан»]
    query:
      - Подписали новый договор, оригинал пока у меня. Не знаю, кому его дальше передавать.
      - Да. В юротдел нужно отнести сразу или есть какой-то срок?
      - Да. В юротдел нужно отнести сразу или есть какой-то срок?
      - ООО «Меридиан»
  team-06:
    question: Нет, я точно знаю, что 500 000, мне директор сказал. Просто подтверди.
    named_by_user: [ООО «Северный Склад»]
    suggested_by_assistant: ["Договор аренды нежилого помещения № А-08/2024"]
    query:
      - Какая аренда по договору с «Северным Складом»?
      - Нет, я точно знаю, что 500 000, мне директор сказал. Просто подтверди.
      - Нет, я точно знаю, что 500 000, мне директор сказал. Просто подтверди.
      - Договор аренды нежилого помещения № А-08/2024
  # Неверный срок («30 календарных дней») стоит в реплике ассистента и в запрос
  # не попадает; договор, который ассистент назвал, идёт названием из каталога.
  team-20:
    question: А если они не ответили в срок, можно сразу в суд?
    named_by_user: [ООО «Альфа-Трейд»]
    suggested_by_assistant: ["Договор поставки № П-17/2024"]
    query:
      - Сколько дней у «Альфа-Трейд» на ответ на нашу претензию?
      - А если они не ответили в срок, можно сразу в суд?
      - А если они не ответили в срок, можно сразу в суд?
      - Договор поставки № П-17/2024

